<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zili Quick</title>
    <link rel="manifest" href="/manifest-quick.json" />
    <meta name="theme-color" content="#7b174e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Zili" />
    <link rel="stylesheet" href="/static/quick.css" />
</head>
<body>
    <div class="status-banner" style="margin-top:1.25rem">
        <div class="status-emoji" id="statusEmoji">🌸</div>
        <div class="status-label" id="statusLabel">loading...</div>
        <div class="status-duration" id="statusDuration">—</div>
    </div>

    <div class="btn-row">
        <button class="quick-btn" id="btnPisis">
            <div class="long-press-bar"></div>
            <span class="btn-emoji">💧</span>
            <span class="btn-label">pisis<br>pelus</span>
        </button>
        <button class="quick-btn" id="btnKakis">
            <div class="long-press-bar"></div>
            <span class="btn-emoji">💩</span>
            <span class="btn-label">kakis<br>pelus</span>
        </button>
        <button class="quick-btn" id="btnBoth">
            <div class="long-press-bar"></div>
            <span class="btn-emoji">🌊💩</span>
            <span class="btn-label">mind-<br>kettő</span>
        </button>
        <button class="quick-btn" id="btnSleep">
            <div class="long-press-bar"></div>
            <span class="btn-emoji" id="sleepBtnEmoji">😴</span>
            <span class="btn-label" id="sleepBtnLabel">elaludt</span>
        </button>
    </div>

    <div class="toast" id="toast"></div>

    <script src="/static/quick.js"></script>
</body>
</html>
