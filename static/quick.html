<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zili Quick</title>
    <link rel="manifest" href="/manifest-quick.json" />
    <meta name="theme-color" content="#7b174e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Zili" />
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:            #fdf2f6;
            --accent:        #db2777;
            --accent2:       #be185d;
            --text:          #4a2438;
            --text2:         #8a5570;
            --border:        #f3d5e3;
            --card:          #ffffff;
            --bar:           #db2777;
            --status-bg:     #fce7f3;
            --status-border: #f9a8d4;
            --status-text:   #9d174d;
            --toast-bg:      #4a2438;
            --sleep-emoji:   "🌸";
        }

        body.sleeping {
            --bg:            #0f172a;
            --accent:        #818cf8;
            --accent2:       #6366f1;
            --text:          #e2e8f0;
            --text2:         #94a3b8;
            --border:        #334155;
            --card:          #1e293b;
            --bar:           #818cf8;
            --status-bg:     #1e1b4b;
            --status-border: #4338ca;
            --status-text:   #a5b4fc;
            --toast-bg:      #1e293b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            transition: background 0.6s, color 0.6s;
        }

        /* Status banner */
        .status-banner {
            margin: 0 1.25rem 1.75rem;
            padding: 1.5rem;
            background: var(--status-bg);
            border: 2px solid var(--status-border);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.2rem;
            transition: background 0.6s, border-color 0.6s;
        }

        .status-emoji { font-size: 2.75rem; line-height: 1; }

        .status-label {
            font-size: 1rem;
            font-weight: 700;
            color: var(--status-text);
            transition: color 0.6s;
        }

        .status-duration {
            font-size: 2rem;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.02em;
            transition: color 0.6s;
        }

        /* 4-button row */
        .btn-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.75rem;
            padding: 0 1.25rem;
        }

        .quick-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 1.1rem 0.4rem 1rem;
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 22px;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            position: relative;
            overflow: hidden;
            transition: background 0.6s, border-color 0.6s, transform 0.12s;
            -webkit-tap-highlight-color: transparent;
            min-height: 120px;
        }

        .quick-btn:active { transform: scale(0.95); }

        .btn-emoji {
            font-size: 2.25rem;
            line-height: 1;
            pointer-events: none;
        }

        .btn-label {
            font-size: 0.65rem;
            font-weight: 700;
            text-align: center;
            color: var(--text2);
            line-height: 1.25;
            pointer-events: none;
            transition: color 0.6s;
        }

        /* sleep button specific */
        #btnSleep .btn-label { color: var(--status-text); transition: color 0.6s; }
        #btnSleep { background: var(--status-bg); border-color: var(--status-border); transition: background 0.6s, border-color 0.6s, transform 0.12s; }

        .long-press-bar {
            display: none;
            position: absolute;
            bottom: 0; left: 0;
            height: 5px;
            width: 0%;
            background: var(--bar);
            border-radius: 0 0 20px 20px;
            transition: background 0.6s;
        }
        .long-press-bar.active { display: block; }

        /* flash on success */
        @keyframes btnFlash {
            0%   { filter: brightness(1); }
            40%  { filter: brightness(1.25); }
            100% { filter: brightness(1); }
        }
        .quick-btn.flash { animation: btnFlash 0.35s ease; }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 2rem; left: 50%;
            transform: translateX(-50%) translateY(0.5rem);
            background: var(--toast-bg);
            color: #fff;
            padding: 0.75rem 1.5rem;
            border-radius: 999px;
            font-size: 0.9rem;
            font-weight: 600;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s, transform 0.25s, background 0.6s;
            white-space: nowrap;
            z-index: 999;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        @media (max-width: 360px) {
            .btn-row { gap: 0.5rem; padding: 0 0.75rem; }
            .btn-emoji { font-size: 1.9rem; }
            .quick-btn { min-height: 100px; }
        }

        @media (min-width: 600px) {
            body { max-width: 500px; margin: 0 auto; }
            .quick-btn { min-height: 150px; }
            .btn-emoji { font-size: 2.75rem; }
            .btn-label { font-size: 0.75rem; }
        }
    </style>
</head>
<body>
    <div class="status-banner" style="margin-top:1.25rem">
        <div class="status-emoji" id="statusEmoji">🌸</div>
        <div class="status-label" id="statusLabel">loading...</div>
        <div class="status-duration" id="statusDuration">—</div>
    </div>

    <div class="btn-row">
        <button class="quick-btn" id="btnPisis">
            <div class="long-press-bar"></div>
            <span class="btn-emoji">💧</span>
            <span class="btn-label">pisis<br>pelus</span>
        </button>
        <button class="quick-btn" id="btnKakis">
            <div class="long-press-bar"></div>
            <span class="btn-emoji">💩</span>
            <span class="btn-label">kakis<br>pelus</span>
        </button>
        <button class="quick-btn" id="btnBoth">
            <div class="long-press-bar"></div>
            <span class="btn-emoji">🌊💩</span>
            <span class="btn-label">mind-<br>kettő</span>
        </button>
        <button class="quick-btn" id="btnSleep">
            <div class="long-press-bar"></div>
            <span class="btn-emoji" id="sleepBtnEmoji">😴</span>
            <span class="btn-label" id="sleepBtnLabel">elaludt</span>
        </button>
    </div>

    <div class="toast" id="toast"></div>

    <script src="/static/quick.js"></script>
</body>
</html>
